name: Build investor-access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - investor-access-src/**
      - .github/workflows/build-investor-access.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: investor-access-src/package-lock.json

      - name: Install dependencies
        working-directory: investor-access-src
        run: npm ci

      - name: Validate required secrets
        env:
          VITE_SITE_ACCESS_PASSWORD: ${{ secrets.VITE_SITE_ACCESS_PASSWORD }}
          VITE_ALLOWED_USERS: ${{ secrets.VITE_ALLOWED_USERS }}
          VITE_ACCESS_SESSION_HOURS: ${{ secrets.VITE_ACCESS_SESSION_HOURS }}
        run: |
          if [ -z "$VITE_SITE_ACCESS_PASSWORD" ]; then
            echo "::error::Missing Actions secret VITE_SITE_ACCESS_PASSWORD. Add it at Settings > Secrets and variables > Actions."
            echo "::error::If you created an Environment secret instead, set an environment on this job so the secret is exposed."
            exit 1
          fi

          if [ -z "$VITE_ALLOWED_USERS" ]; then
            echo "::warning::VITE_ALLOWED_USERS is empty. Login will accept any username with the correct password."
          fi

          if [ -z "$VITE_ACCESS_SESSION_HOURS" ]; then
            echo "::notice::VITE_ACCESS_SESSION_HOURS is empty. App default of 12 hours will be used."
          fi

      - name: Build investor-access with secrets
        working-directory: investor-access-src
        env:
          VITE_ENFORCE_ACCESS: "true"
          VITE_SITE_ACCESS_PASSWORD: ${{ secrets.VITE_SITE_ACCESS_PASSWORD }}
          VITE_ALLOWED_USERS: ${{ secrets.VITE_ALLOWED_USERS }}
          VITE_ACCESS_SESSION_HOURS: ${{ secrets.VITE_ACCESS_SESSION_HOURS }}
        run: npm run build

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investor-access
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Build investor-access from source"
          git push
