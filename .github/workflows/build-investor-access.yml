name: Build investor-access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - investor-access-src/**
      - .github/workflows/build-investor-access.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: investor-access-src/package-lock.json

      - name: Install dependencies
        working-directory: investor-access-src
        run: npm ci

      - name: Build investor-access with secrets
        working-directory: investor-access-src
        env:
          VITE_ENFORCE_ACCESS: "true"
          VITE_SITE_ACCESS_PASSWORD: ${{ secrets.VITE_SITE_ACCESS_PASSWORD }}
          VITE_ALLOWED_USERS: ${{ secrets.VITE_ALLOWED_USERS }}
          VITE_ACCESS_SESSION_HOURS: ${{ secrets.VITE_ACCESS_SESSION_HOURS }}
        run: npm run build

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investor-access
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Build investor-access from source"
          git push
